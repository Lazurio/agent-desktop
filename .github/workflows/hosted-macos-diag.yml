name: Hosted macOS diagnosis of scroll-area geometry

# Lazurio/agent-desktop#2: on macOS 26 the fixture's primary button is reported
# offscreen because the enclosing SwiftUI AXScrollArea publishes a frame that
# is not its visible viewport. This job records, per runner image, the AX
# frames of the button, its ancestors and its window (window near the left
# edge and moved right), what agent-desktop reports for the button, a click,
# and the frames of a few probe scroll areas (SwiftUI with hidden indicators,
# SwiftUI content that fits, AppKit without a horizontal scroller).
# Never merged.

on:
  push:
    branches: ["e2e/diag-*"]

permissions: {}

jobs:
  diag:
    name: scroll geometry (${{ matrix.label }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: before-8e403858, ref: 8e403858e43dd484437cb3ce815e979872abbc55, runner: macos-26 }
          - { label: fix-04e49cfa, ref: 04e49cfa062846d03d5c5f91c7f6bc784b7dcc68, runner: macos-26 }
          - { label: fix-04e49cfa, ref: 04e49cfa062846d03d5c5f91c7f6bc784b7dcc68, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diag
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          path: candidate
          persist-credentials: false
      - name: Build
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          cargo build --locked --release -p agent-desktop
          cargo build --locked --release -p agent-desktop-macos --bin agent-desktop-macos-helper
      - name: Record geometry
        run: |
          set +e
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          B="$PWD/candidate/target/release/agent-desktop"
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools"
          { sw_vers; uname -m; } > "$out/machine.txt"
          swiftc -O -o "$tools/axgeom" diag/tests/diag/axgeom.swift -framework Cocoa
          swiftc -O -parse-as-library -o "$tools/scrollprobe" diag/tests/diag/scrollprobe.swift -framework SwiftUI -framework AppKit
          AGENT_DESKTOP_FIXTURE_BACKGROUND_BUNDLE=1 bash candidate/tests/fixture-app/build.sh "$tools/fixture" > "$out/fixture-build.log" 2>&1
          osascript -e 'tell application "Finder" to make new Finder window' \
                    -e 'tell application "Finder" to activate'
          AGENT_DESKTOP_FIXTURE_NO_ACTIVATE=1 "$tools/fixture/AgentDeskFixture.app/Contents/MacOS/AgentDeskFixture" > "$out/fixture.out" 2>&1 &
          fpid=$!
          sleep 5
          for geom in 20,28,1400,866 400,120,1383,790; do
            IFS=, read -r x y w h <<< "$geom"
            "$tools/axgeom" move "$fpid" "$x" "$y" >> "$out/diag.log"
            "$tools/axgeom" resize "$fpid" "$w" "$h" >> "$out/diag.log"
            sleep 1
            tag="$x-$y-$w"
            "$tools/axgeom" dump "$fpid" primary-button > "$out/ax-$tag.json"
            "$B" snapshot --app AgentDeskFixture --include-bounds > "$out/snapshot-$tag.json" 2>&1
            "$B" find --app AgentDeskFixture --role button --name primary-button --exact --limit 2 > "$out/find-$tag.json" 2>&1
            ref="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["matches"][0]["ref_id"])' "$out/find-$tag.json")"
            "$B" click "$ref" --timeout-ms 1500 > "$out/click-$tag.json" 2>&1
            echo "geometry $geom click exit $?" >> "$out/diag.log"
            sleep 0.5
            "$B" find --app AgentDeskFixture --role statictext --native-id click-status --exact --limit 2 > "$out/status-$tag.json" 2>&1
          done
          "$tools/axgeom" tree "$fpid" 3 > "$out/tree.json"
          kill "$fpid"
          "$tools/scrollprobe" & ppid=$!
          sleep 5
          "$tools/axgeom" move "$ppid" 100 100 >> "$out/diag.log"
          sleep 1
          "$tools/axgeom" scrollareas "$ppid" > "$out/probe.json"
          kill "$ppid"
          python3 - "$out" <<'PY' | tee "$out/summary.txt"
          import json, os, sys
          out = sys.argv[1]
          print(open(os.path.join(out, "machine.txt")).read())
          for name in sorted(os.listdir(out)):
              if name.startswith("ax-"):
                  d = json.load(open(os.path.join(out, name)))
                  print("==", name, "window", d["window"].get("pos"), d["window"].get("size"))
                  for c in d.get("chain", []):
                      print("  ", c.get("role"), c.get("desc"), c.get("pos"), c.get("size"), "vbar" if c.get("vbar") else "", "hbar" if c.get("hbar") else "")
              if name.startswith("snapshot-"):
                  def walk(n, acc):
                      if isinstance(n, dict):
                          if "role" in n and "bounds" in n: acc.append(n)
                          for v in n.values(): walk(v, acc)
                      elif isinstance(n, list):
                          for v in n: walk(v, acc)
                  try:
                      acc = []; walk(json.load(open(os.path.join(out, name))).get("data"), acc)
                      print("==", name, "nodes", len(acc), "offscreen", sum("offscreen" in (n.get("states") or []) for n in acc))
                  except Exception as error:
                      print("==", name, "unreadable", error)
              if name.startswith(("find-", "click-", "status-")):
                  print("==", name, open(os.path.join(out, name)).read()[:600])
          print("== probe")
          print(open(os.path.join(out, "probe.json")).read())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.label }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/out
